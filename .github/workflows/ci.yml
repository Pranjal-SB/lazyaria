name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push cancels the run still going for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Test
        run: go test -race ./...

      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64 freebsd/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build ./...
          done

      # internal/cli and the root package still use unix-only process APIs,
      # so windows builds skip them until they get windows support.
      - name: Cross-compile windows
        run: |
          pkgs=$(go list ./... | grep -v -e '/internal/cli$' -e '/lazyaria$')
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build $pkgs

      # Only packages that declare a fuzz target, so the loop does not build
      # and run every other test binary just to list nothing.
      - name: Fuzz smoke
        run: |
          for dir in $(grep -rl --include='*_test.go' '^func Fuzz' . | xargs -n1 dirname | sort -u); do
            for target in $(go test -list '^Fuzz' "$dir" | grep '^Fuzz'); do
              go test -run '^$' -fuzz "^${target}\$" -fuzztime 10s "$dir"
            done
          done

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      # The disk-full test mounts a tmpfs in a user namespace. Ubuntu's
      # AppArmor blocks that by default. The run is strict, so if this step
      # cannot lift the block it fails here, not later in the test.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: End-to-end
        env:
          E2E_STRICT: "1"
        # About 3.5 minutes on a fast desktop; the default 10m limit is too
        # tight for a slower runner under -race.
        run: go test -race -timeout 20m -tags e2e -v ./e2e/
