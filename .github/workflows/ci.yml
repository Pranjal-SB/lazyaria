name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Install aria2
        run: sudo apt-get install -y aria2

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64 freebsd/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build ./...
          done

      # internal/cli and the root package still use unix-only process APIs,
      # so windows builds skip them until they get windows support.
      - name: Cross-compile windows
        run: |
          pkgs=$(go list ./... | grep -v -e '/internal/cli$' -e '/lazyaria$')
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build $pkgs

      - name: Fuzz smoke
        run: |
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz'); do
              go test -run '^$' -fuzz "^${target}\$" -fuzztime 10s "$pkg"
            done
          done

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Install aria2
        run: sudo apt-get install -y aria2

      # The disk-full test mounts a tmpfs in a user namespace. Ubuntu's
      # AppArmor blocks that by default, and the test skips without it.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: End-to-end
        run: go test -race -tags e2e -v ./e2e/
